# Transitivas con avisos de seguridad que Next.js 16.2.12 arrastra pinneadas. `sharp` es la que
# importa de verdad: es lo que el optimizador de imágenes usa para procesar CADA foto que sube un
# dueño, así que una vulnerabilidad de libvips ahí se alcanza con datos de usuario
# (auditoría del 2026-08-08). Las otras dos son de tiempo de build.
#
# Va aquí y no en package.json: pnpm 11 dejó de leer el campo `pnpm.overrides` de package.json.
overrides:
  sharp: '>=0.35.3'
  postcss: '>=8.5.23'
  nanoid: '>=3.3.17'

allowBuilds:
  '@sentry/cli': true
  esbuild: true
  sharp: true
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
minimumReleaseAgeExclude:
  - '@sentry/browser-utils@10.69.0'
  - '@sentry/browser@10.69.0'
  - '@sentry/core@10.69.0'
  - '@sentry/feedback@10.69.0'
  - '@sentry/nextjs@10.69.0'
  - '@sentry/node-core@10.69.0'
  - '@sentry/node@10.69.0'
  - '@sentry/opentelemetry@10.69.0'
  - '@sentry/react@10.69.0'
  - '@sentry/replay-canvas@10.69.0'
  - '@sentry/replay@10.69.0'
  - '@sentry/server-utils@10.69.0'
  - '@sentry/vercel-edge@10.69.0'
  - stripe@22.4.0
